<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ใบสมัครเข้าศึกษา</title>
  <meta name="theme-color" content="#D11A2B">
  <link rel="icon" href="/assets/icon.svg">
  <link rel="stylesheet" href="/shared/base.css">
  <!-- 12 พ.ย. 2569: หน้าพิมพ์ใบสมัคร (คิวอาร์โค้ดขั้นสุดท้ายของเส้นทางการสมัครเรียน)
       · มีไฟล์ใบสมัครจริงในหลังบ้าน (admission_form_url) → เปิดไฟล์จริงทันที
       · ยังไม่มี → ใบสมัครแบบกรอกด้วยมือ/พิมพ์บนมือถือ ข้อมูลที่พิมพ์อยู่ในเครื่องผู้ใช้เท่านั้น ไม่ส่งไปที่เซิร์ฟเวอร์ -->
  <style>
    body { background: #eef2f7; font-size: 15px; color: #1b2430; }
    .bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 8px; align-items: center; padding: 10px 14px; background: #D11A2B; color: #fff; }
    .bar h1 { flex: 1; margin: 0; font-size: 1rem; font-weight: 600; }
    .bar button { border: 0; border-radius: 999px; padding: 9px 16px; font-weight: 700; font-size: .95rem; background: #fff; color: #D11A2B; }
    .bar button.ghost { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.7); }
    .note { margin: 12px auto 0; max-width: 210mm; padding: 10px 14px; border-radius: 12px; background: #fff7df; color: #6b5200; font-size: .88rem; line-height: 1.55; }
    .sheet { margin: 12px auto 40px; max-width: 210mm; background: #fff; padding: 14mm 14mm 12mm; box-shadow: 0 6px 24px rgba(0,0,0,.1); border-radius: 6px; }
    .head { display: flex; gap: 14px; align-items: flex-start; border-bottom: 2px solid #1b2430; padding-bottom: 8px; }
    .head .t { flex: 1; text-align: center; }
    .head h2 { margin: 0; font-size: 1.35rem; }
    .head h3 { margin: 2px 0 0; font-size: 1.05rem; font-weight: 600; }
    .head .yr { margin-top: 4px; font-size: .95rem; }
    .photo { width: 30mm; height: 38mm; border: 1px dashed #777; display: grid; place-items: center; font-size: .75rem; color: #777; text-align: center; flex: none; }
    .no { width: 30mm; font-size: .8rem; flex: none; }
    h4 { margin: 12px 0 4px; font-size: 1rem; background: #e7edf5; padding: 3px 8px; border-radius: 4px; }
    .row { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 5px 0; }
    .f { display: flex; align-items: flex-end; gap: 6px; flex: 1 1 200px; min-width: 0; }
    .f.s { flex: 0 1 150px; } .f.w { flex-basis: 100%; }
    .f span { white-space: nowrap; font-size: .93rem; }
    .f input { flex: 1; min-width: 40px; border: 0; border-bottom: 1px dotted #333; border-radius: 0; padding: 2px 4px; font: inherit; background: transparent; }
    .f input:focus { outline: none; background: #f2f7ff; }
    .chk { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 14px; margin: 4px 0; font-size: .92rem; }
    .chk label { display: flex; gap: 6px; align-items: center; }
    .sign { display: flex; justify-content: space-between; gap: 20px; margin-top: 16px; font-size: .92rem; }
    .sign div { flex: 1; text-align: center; }
    .sign .ln { border-bottom: 1px dotted #333; height: 26px; margin-bottom: 4px; }
    .staff { margin-top: 12px; border: 1px solid #999; padding: 6px 10px; font-size: .85rem; }
    .muted { color: #667; font-size: .8rem; }
    .loading { text-align: center; padding: 40px; color: #556; }
    @media (max-width: 600px) { .sheet { padding: 16px 12px; border-radius: 0; } .photo, .no { display: none; } .chk { grid-template-columns: 1fr; } }
    @media print {
      @page { size: A4; margin: 10mm; }
      body { background: #fff; font-size: 13px; }
      .bar, .note { display: none !important; }
      .sheet { margin: 0; padding: 0; box-shadow: none; max-width: none; }
      .photo, .no { display: grid !important; }
      .no { display: block !important; }
      .chk { grid-template-columns: 1fr 1fr !important; }
      .f input { border-bottom: 1px dotted #000; }
      h4 { background: #eee !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <div class="bar"><h1 id="barTitle">ใบสมัครเข้าศึกษา</h1><button type="button" class="ghost" id="clearBtn">ล้าง</button><button type="button" id="printBtn">🖨 พิมพ์ / บันทึก PDF</button></div>
  <p class="note" id="note">กรอกบนมือถือแล้วกด “พิมพ์ / บันทึก PDF” หรือพิมพ์ใบเปล่าไปกรอกด้วยมือก็ได้ · ข้อมูลที่กรอกอยู่ในเครื่องของคุณเท่านั้น ไม่ถูกส่งไปที่ใด · นำใบสมัครพร้อมเอกสารไปยื่นที่งานทะเบียนของวิทยาลัย</p>
  <main class="sheet" id="sheet"><p class="loading">กำลังเตรียมใบสมัคร…</p></main>
<script type="module">
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const q = new URLSearchParams(location.search);
const get = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); };

let cfg = {};
try { cfg = await get("/api/kiosk/config"); } catch { /* ใช้ค่าว่าง */ }
const form = cfg.admission_form || {};
if (form.url && !q.has("vora")) {              // มีไฟล์ใบสมัครจริง → เปิดไฟล์จริง
  location.replace(new URL(form.url, location.href).href);
} else {
  let p = null;
  const pid = parseInt(q.get("program") || "", 10);
  if (pid > 0) { try { p = await get(`/api/programs/${pid}`); } catch { p = null; } }
  const school = cfg.school_name_th || "วิทยาลัย";
  const thYear = new Date().getFullYear() + 543 + (new Date().getMonth() >= 9 ? 1 : 0);   // ต.ค. เป็นต้นไป = รับสมัครปีการศึกษาถัดไป
  document.title = `ใบสมัครเข้าศึกษา · ${school}`;
  $("barTitle").textContent = `ใบสมัคร · ${school}`;
  const F = (label, name, cls = "", val = "", type = "text") =>
    `<label class="f ${cls}"><span>${esc(label)}</span><input name="${name}" type="${type}" value="${esc(val)}" autocomplete="off"></label>`;
  const C = (label) => `<label><input type="checkbox"> ${esc(label)}</label>`;
  $("sheet").innerHTML = `
    <div class="head"><div class="no">เลขที่ใบสมัคร<br>...................</div>
      <div class="t"><h2>ใบสมัครเข้าศึกษา</h2><h3>${esc(school)}</h3><div class="yr">ปีการศึกษา ${thYear}</div></div>
      <div class="photo">ติดรูปถ่าย<br>1 นิ้ว</div></div>
    <h4>1. สาขาวิชาที่ต้องการสมัคร</h4>
    <div class="row">${F("ระดับ", "level", "s", p ? p.level || "" : "")}${F("แผนกวิชา", "dept", "", p ? p.department || "" : "")}</div>
    <div class="row">${F("สาขาวิชา", "program", "w", p ? p.name_th : "")}</div>
    <div class="row">${F("สาขาวิชาอันดับ 2 (ถ้ามี)", "program2", "w")}</div>
    <h4>2. ข้อมูลผู้สมัคร</h4>
    <div class="row">${F("คำนำหน้า", "title", "s")}${F("ชื่อ", "fname")}${F("นามสกุล", "lname")}</div>
    <div class="row">${F("เลขประจำตัวประชาชน", "cid", "", "", "tel")}${F("วันเดือนปีเกิด", "dob", "s")}${F("อายุ", "age", "s", "", "tel")}</div>
    <div class="row">${F("สัญชาติ", "nat", "s")}${F("ศาสนา", "rel", "s")}${F("โรคประจำตัว", "health")}</div>
    <div class="row">${F("ที่อยู่ปัจจุบัน", "addr", "w")}</div>
    <div class="row">${F("", "addr2", "w")}</div>
    <div class="row">${F("โทรศัพท์", "tel", "", "", "tel")}${F("อีเมล / ไลน์", "contact")}</div>
    <h4>3. ประวัติการศึกษา</h4>
    <div class="row">${F("จบการศึกษาระดับ", "edu")}${F("ปีที่จบ", "eduyr", "s", "", "tel")}${F("เกรดเฉลี่ย", "gpa", "s")}</div>
    <div class="row">${F("จากสถานศึกษา", "school", "")}${F("จังหวัด", "prov", "s")}</div>
    <h4>4. ข้อมูลผู้ปกครอง</h4>
    <div class="row">${F("ชื่อ-นามสกุล", "pname")}${F("เกี่ยวข้องเป็น", "prel", "s")}</div>
    <div class="row">${F("อาชีพ", "pjob")}${F("โทรศัพท์", "ptel", "", "", "tel")}</div>
    <h4>5. เอกสารประกอบการสมัคร (ทำเครื่องหมาย ✓)</h4>
    <div class="chk">${C("สำเนาใบแสดงผลการเรียน")}${C("สำเนาทะเบียนบ้าน")}${C("สำเนาบัตรประจำตัวประชาชน")}${C("รูปถ่ายขนาด 1 นิ้ว")}${C("สำเนาบัตรผู้ปกครอง")}${C("อื่น ๆ ........................")}</div>
    <p class="muted">เอกสารและคุณสมบัติจริงให้ยึดตามประกาศรับสมัครของวิทยาลัย</p>
    <div class="sign"><div><div class="ln"></div>ลงชื่อผู้สมัคร<br>วันที่ ......../......../........</div><div><div class="ln"></div>ลงชื่อผู้ปกครอง<br>วันที่ ......../......../........</div></div>
    <div class="staff"><b>สำหรับเจ้าหน้าที่</b> · ตรวจเอกสาร ☐ ครบ ☐ ไม่ครบ · ผู้รับสมัคร ........................ วันที่ ......../......../........</div>`;
  $("printBtn").onclick = () => print();
  $("clearBtn").onclick = () => { $("sheet").querySelectorAll("input[type=text],input[type=tel]").forEach((i) => { if (!["level", "dept", "program"].includes(i.name)) i.value = ""; });
    $("sheet").querySelectorAll("input[type=checkbox]").forEach((i) => (i.checked = false)); };
  if (q.get("print") === "1") setTimeout(() => print(), 400);
}
</script>
</body>
</html>
