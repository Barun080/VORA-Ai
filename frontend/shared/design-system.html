<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VORA Design System</title>
  <link rel="stylesheet" href="/shared/base.css">
  <style>
    /* เฉพาะการจัดวางของหน้าอ้างอิงนี้ — สี/ฟอนต์/ระยะมาจาก token ทั้งหมด */
    body.vora-root { background: var(--vora-bg); color: var(--vora-text); font-family: var(--vora-font-body); }   /* base.css มี body {…} ที่เฉพาะเจาะจงกว่า :where(.vora-root) */
    .ds { margin: 0 auto; max-width: 1280px; padding: var(--vora-space-5); }
    .ds-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--vora-space-3); margin-bottom: var(--vora-space-5); }
    .ds-top h1 { margin: 0; font-size: var(--vora-fs-2xl); }
    .ds-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); gap: var(--vora-space-5); }
    .ds-panel { padding: var(--vora-space-5); border-radius: var(--vora-radius-lg); border: 1px solid var(--vora-border); }
    .ds-panel h2 { margin: 0 0 var(--vora-space-4); font-size: var(--vora-fs-xl); }
    .ds-panel h3 { margin: var(--vora-space-5) 0 var(--vora-space-3); font-size: var(--vora-fs-md); color: var(--vora-text-muted); }
    .ds-row { display: flex; flex-wrap: wrap; gap: var(--vora-space-3); align-items: center; }
    .ds-sw { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--vora-space-2); }
    .ds-sw div { display: grid; gap: 2px; font-size: var(--vora-fs-xs); }
    .ds-sw i { display: block; height: 36px; border-radius: var(--vora-radius-sm); border: 1px solid var(--vora-border); }
    .ds-sw code { font-family: var(--vora-font-mono); color: var(--vora-text-muted); }
    .ds-icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: var(--vora-space-2); }
    .ds-icons figure { margin: 0; display: grid; justify-items: center; gap: var(--vora-space-1); padding: var(--vora-space-2); border-radius: var(--vora-radius-md); background: var(--vora-surface-2); font-size: var(--vora-fs-xs); }
    .ds-icons .vora-icon { width: 28px; height: 28px; }
    .ds-type p { margin: 0 0 var(--vora-space-1); }
  </style>
</head>
<body class="vora-root" data-vora-theme="light">
  <main class="ds">
    <header class="ds-top">
      <div>
        <h1>VORA Design System</h1>
        <p class="vora-field__hint" style="margin:0">Phase 6 · Gate 6B Foundation — token <code>--vora-*</code> · ฟอนต์ Anuphan · ธีมสว่าง/มืด · คอมโพเนนต์ · ไอคอน SVG (หน้าอ้างอิงสำหรับทีม ไม่ใช่หน้าสำหรับผู้เข้าชม)</p>
      </div>
      <button type="button" class="vora-btn vora-btn--primary" id="themeToggle"><span data-vora-icon="star"></span><span>สลับธีมทั้งหน้า</span></button>
    </header>

    <div class="ds-cols">
      <section class="ds-panel vora-root" data-vora-theme="light" data-panel="light"></section>
      <section class="ds-panel vora-root" data-vora-theme="dark" data-panel="dark"></section>
    </div>
  </main>

  <template id="panelTpl">
    <h2 data-title></h2>
    <h3>สี (ค่าจริงจาก tokens.css)</h3>
    <div class="ds-sw" data-swatches></div>

    <h3>ตัวอักษร (Anuphan)</h3>
    <div class="ds-type">
      <p style="font-size:var(--vora-fs-3xl);font-weight:var(--vora-fw-bold)">วอร่า VORA 3xl</p>
      <p style="font-size:var(--vora-fs-xl);font-weight:var(--vora-fw-semibold)">หัวข้อ xl — สาขาเทคโนโลยีสารสนเทศ</p>
      <p style="font-size:var(--vora-fs-md)">เนื้อความ md — เปิดรับสมัครนักเรียนใหม่ รอบโควตา 3 พฤศจิกายน 2569</p>
      <p style="font-size:var(--vora-fs-sm);color:var(--vora-text-muted)">รอง sm — ไม่ระบุเวลา · ไม่ระบุสถานที่</p>
    </div>

    <h3>ปุ่ม</h3>
    <div class="ds-row">
      <button type="button" class="vora-btn vora-btn--primary"><span data-vora-icon="chat"></span>ถามวอร่า</button>
      <button type="button" class="vora-btn">ปุ่มปกติ</button>
      <button type="button" class="vora-btn vora-btn--ghost"><span data-vora-icon="back"></span>กลับ</button>
      <button type="button" class="vora-btn vora-btn--danger"><span data-vora-icon="stop"></span>หยุด</button>
      <button type="button" class="vora-btn" disabled>ใช้ไม่ได้</button>
    </div>
    <div class="ds-row" style="margin-top:var(--vora-space-3)">
      <button type="button" class="vora-btn vora-btn--primary vora-btn--kiosk"><span data-vora-icon="mic"></span>ขนาด Kiosk</button>
    </div>

    <h3>ป้าย · สถานะ AI</h3>
    <div class="ds-row">
      <span class="vora-badge vora-badge--brand">รับสมัคร</span>
      <span class="vora-badge vora-badge--ok">เผยแพร่แล้ว</span>
      <span class="vora-badge vora-badge--warn">รออนุมัติ</span>
      <span class="vora-badge vora-badge--danger">ขัดข้อง</span>
      <span class="vora-badge vora-badge--info">ข้อมูล</span>
      <span class="vora-badge">ฉบับร่าง</span>
    </div>
    <div class="ds-row" style="margin-top:var(--vora-space-3)">
      <span class="vora-state vora-state--listen">กำลังฟัง</span>
      <span class="vora-state vora-state--think">กำลังคิด</span>
      <span class="vora-state vora-state--speak">กำลังพูด</span>
      <span class="vora-state">พร้อม</span>
    </div>

    <h3>แท็บ</h3>
    <div class="vora-tabs" role="tablist">
      <button type="button" class="vora-tab" role="tab" aria-selected="true">ถามวอร่า</button>
      <button type="button" class="vora-tab" role="tab" aria-selected="false">สาขาเรียน</button>
      <button type="button" class="vora-tab" role="tab" aria-selected="false">ข่าว</button>
    </div>

    <h3>การ์ดกิจกรรม · วันที่ / เวลา / สถานที่</h3>
    <article class="vora-card">
      <h4 class="vora-card__title">Open House วิทยาลัย</h4>
      <dl class="vora-meta">
        <dt><span data-vora-icon="calendar"></span>วันที่</dt><dd>วันอาทิตย์ที่ 8 พฤศจิกายน 2569</dd>
        <dt><span data-vora-icon="clock"></span>เวลา</dt><dd class="is-unknown">ไม่ระบุเวลา</dd>
        <dt><span data-vora-icon="pin"></span>สถานที่</dt><dd>หอประชุมวิทยาลัย (ภายในวิทยาลัย) <a class="vora-link" href="#map">เปิดแผนที่</a></dd>
      </dl>
    </article>

    <h3>ป้ายแจ้ง (notice)</h3>
    <div class="vora-notice"><span data-vora-icon="info"></span><span>ข้อมูลจากอินเทอร์เน็ต ไม่ใช่ข้อมูลทางการของวิทยาลัย</span></div>
    <div class="vora-notice vora-notice--warn" style="margin-top:var(--vora-space-2)"><span data-vora-icon="wifi-off"></span><span>ฟังเสียงไม่ได้ขณะไม่มีอินเทอร์เน็ต — พิมพ์คำถามแทน</span></div>

    <h3>ช่องกรอก</h3>
    <label class="vora-field">
      <span class="vora-field__label">ชื่อสถานที่</span>
      <input class="vora-input" value="อาคาร 2 ห้อง 201">
      <span class="vora-field__hint">ไม่บังคับสำหรับกิจกรรมออนไลน์</span>
    </label>

    <h3>การ์ด QR (บอกปลายทางเสมอ)</h3>
    <div class="ds-row">
      <figure class="vora-qr-card"><div class="vora-qr-card__code" data-qr></div><figcaption><div class="vora-qr-card__dest">รายละเอียดกิจกรรมนี้</div><div class="vora-qr-card__hint">สแกนเพื่อเปิดบนมือถือ</div></figcaption></figure>
    </div>

    <h3>ตาราง</h3>
    <table class="vora-table">
      <thead><tr><th>หัวข้อ</th><th>ประเภท</th><th>สถานะ</th></tr></thead>
      <tbody><tr><td>เปิดรับสมัครนักเรียนใหม่</td><td class="vora-nowrap">รับสมัคร</td><td><span class="vora-badge vora-badge--ok">เผยแพร่แล้ว</span></td></tr></tbody>
    </table>

    <h3>Toast</h3>
    <div class="vora-toast"><span data-vora-icon="check"></span>บันทึกแล้ว</div>

    <h3>ไอคอน</h3>
    <div class="ds-icons" data-icons></div>
  </template>

  <script type="module">
    import { icon, ICON_NAMES, hydrateIcons } from "/shared/icons.js";
    import { applyTheme, currentTheme, token } from "/shared/theme.js";

    const COLOR_TOKENS = ["--vora-bg", "--vora-surface-1", "--vora-surface-2", "--vora-surface-3", "--vora-border", "--vora-text", "--vora-text-muted",
      "--vora-text-accent", "--vora-link", "--vora-brand", "--vora-on-brand", "--vora-ok", "--vora-warn", "--vora-danger", "--vora-info",
      "--vora-state-listen", "--vora-state-think", "--vora-state-speak"];
    const TITLES = { light: "ธีมสว่าง — Mobile / Admin", dark: "ธีมมืด — Kiosk" };
    const tpl = document.getElementById("panelTpl");

    for (const panel of document.querySelectorAll("[data-panel]")) {
      panel.append(tpl.content.cloneNode(true));
      panel.querySelector("[data-title]").textContent = TITLES[panel.dataset.panel];
      panel.querySelector("[data-swatches]").innerHTML = COLOR_TOKENS.map((t) =>
        `<div><i style="background:var(${t})"></i><b>${t.replace("--vora-", "")}</b><code data-token="${t}">${token(t, panel)}</code></div>`).join("");
      panel.querySelector("[data-icons]").innerHTML = ICON_NAMES.map((n) => `<figure>${icon(n, { label: n })}<figcaption>${n}</figcaption></figure>`).join("");
      // QR ตัวอย่าง (ใช้ qrcode.js ที่มีอยู่แล้วในเครื่อง ถ้าโหลดได้)
      const q = panel.querySelector("[data-qr]");
      q.innerHTML = icon("qr", { label: "QR ตัวอย่าง", size: "lg" });
    }
    hydrateIcons(document);

    document.getElementById("themeToggle").onclick = () => {
      applyTheme(currentTheme(document.body) === "dark" ? "light" : "dark", document.body);
    };
    window.VORA_DS = { ICON_NAMES, COLOR_TOKENS, token, applyTheme, currentTheme };
  </script>
</body>
</html>
